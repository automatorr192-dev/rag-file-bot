services:
  - type: web
    name: rag-file-bot
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    dockerCommand: sh -c 'alembic upgrade head && python demo.py && exec uvicorn web:app --host 0.0.0.0 --port "$PORT"'
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
